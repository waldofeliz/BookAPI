services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookapi-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Admin123!Secure}"
    ports:
      - "1433:1433"
    volumes:
      - bookapi-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD:-Admin123!Secure}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookapi-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BookAPI;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Admin123!Secure};TrustServerCertificate=True"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_USE_USER_SECRETS_OR_ENV_MIN_32_CHARS_LONG!}"
      Jwt__Issuer: BookAPI
      Jwt__Audience: BookAPI.Clients
      Jwt__RequireHttpsMetadata: "false"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  bookapi-sql-data:
